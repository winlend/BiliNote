name: Commit Lint

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - develop
      - master

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: Lint commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 本仓库是 JefferyHcool/BiliNote 的 fork，master 会周期性地把上游历史整段并进来
      # （merge upstream/master）。那段历史里存在 v2.1.x 时代不合规的提交标题
      # （"Release v2.1.3"、"Update README.md"、'"Claude Code Review workflow"' 等），
      # 直接按 github.event.before..github.sha 校验会把它们全量报错。
      # 这里改成以「与上游的分叉点」为基准：只校验本仓库自己写的提交。
      - name: Resolve lint range
        id: range
        shell: bash
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000
          FROM="${{ github.event.before }}"
          if [ -z "$FROM" ] || [ "$FROM" = "$ZERO" ]; then
            FROM="$(git rev-parse HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          fi

          git remote add upstream https://github.com/JefferyHcool/BiliNote.git 2>/dev/null || true
          if git fetch --no-tags --quiet upstream master 2>/dev/null; then
            MERGE_BASE="$(git merge-base HEAD upstream/master || true)"
            if [ -n "$MERGE_BASE" ]; then
              FROM="$MERGE_BASE"
              echo "Using upstream merge-base as base: $FROM"
            fi
          else
            echo "Could not fetch upstream; falling back to pushed range base: $FROM"
          fi

          {
            echo "from=$FROM"
            echo "to=${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Run commitlint
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json
          failOnWarnings: false
          extraArgs: --from ${{ steps.range.outputs.from }} --to ${{ steps.range.outputs.to }}
          helpURL: https://github.com/JefferyHcool/BiliNote/blob/develop/CONTRIBUTING.md#5-提交规范
